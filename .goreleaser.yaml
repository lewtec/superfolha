# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
#
# Binaries + GHCR image (texlive base). Docker context is only the prebuilt
# binary layout from dockers_v2 — see root Dockerfile (COPY $TARGETPLATFORM/...).
# Full multi-stage image without GoReleaser: `docker build -f Dockerfile.build`.

version: 2
project_name: superfolha

before:
  hooks:
    # Same layout as gaderno / contapila / orvalho / telegram-sendmail:
    # tidy + one mise entry that owns lint/fmt/test/frontend embed.
    - go mod tidy
    - mise run ci

builds:
  - id: superfolha
    binary: superfolha
    main: ./cmd/superfolha
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Docker needs linux; skip rare combos if any
      - goos: darwin
        goarch: 386

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

dockers_v2:
  - id: superfolha
    ids:
      - superfolha
    dockerfile: Dockerfile
    images:
      - "ghcr.io/lewtec/{{ .ProjectName }}"
    tags:
      - "{{ .Version }}"
      - latest
    sbom: false
    platforms:
      # texlive image is large; ship amd64 first (same as ciborg). Add arm64 when needed.
      - linux/amd64
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.description": "Web LaTeX editor with Git + live collab (TeX Live runtime)"
    flags:
      - "--provenance=false"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

snapshot:
  version_template: "{{ .Tag }}-next"

release:
  draft: false
  prerelease: auto
  footer: >-

    ---

    **Binary**

    Download the archive for your OS/arch, extract `superfolha`, put it on `PATH`.
    Requires a TeX Live / `latexmk` install on the host for compilation.

    ```text
    export JWT_SECRET=change-me
    ./superfolha --state-dir=./data
    ```

    **Container** (TeX Live base — latexmk included)

    ```text
    docker pull ghcr.io/lewtec/superfolha:{{ .Version }}
    docker run --rm -p 8080:8080 \
      -e JWT_SECRET=change-me \
      -v superfolha-data:/data \
      ghcr.io/lewtec/superfolha:{{ .Version }}
    ```

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
