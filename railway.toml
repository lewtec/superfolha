# Superfolha — Railway config as code (single service).
# https://docs.railway.com/config-as-code
#
# Persistence: SQLite at $STATE_DIR/superfolha.db on the volume.
#
# Always: volume at /data, JWT_SECRET, public domain.
# PORT is injected by Railway.

[build]
builder = "DOCKERFILE"
# Multi-stage source build (SPA + Go + TeX Live). Releases also publish ghcr.io/lewtec/superfolha.
dockerfilePath = "Dockerfile.build"

[deploy]
startCommand = "/app/server"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
requiredMountPath = "/data"
numReplicas = 1
