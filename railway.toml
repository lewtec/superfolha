# Superfolha — Railway config as code (single service).
# https://docs.railway.com/config-as-code
#
# Default persistence: SQLite on the volume (DB_DRIVER=sqlite).
# Optional Postgres: add Railway Postgres plugin, set
#   DB_DRIVER=postgres
#   DATABASE_URL=${{Postgres.DATABASE_URL}}  (or link variable)
#
# Always: volume at /data, JWT_SECRET, public domain.
# PORT is injected by Railway.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/server"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
requiredMountPath = "/data"
numReplicas = 1
