# Superfolha on Render — SQLite on the volume at $STATE_DIR/superfolha.db.
projects:
  - name: superfolha
    environments:
      - name: production
        services:
          - type: web
            name: superfolha
            runtime: docker
            plan: starter
            region: oregon
            # Multi-stage source build; or deploy the published ghcr.io/lewtec/superfolha image.
            dockerfilePath: ./Dockerfile.build
            healthCheckPath: /
            disk:
              name: superfolha-data
              mountPath: /data
              sizeGB: 2
            envVars:
              - key: JWT_SECRET
                generateValue: true
              - key: STATE_DIR
                value: /data
