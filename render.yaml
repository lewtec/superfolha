# Superfolha on Render — default: SQLite on the volume (no managed Postgres).
# For Postgres: drop DATABASE_URL file path, add a databases: entry, and set
# DB_DRIVER=postgres + DATABASE_URL fromDatabase connectionString.
projects:
  - name: superfolha
    environments:
      - name: production
        services:
          - type: web
            name: superfolha
            runtime: docker
            plan: starter
            region: oregon
            # Multi-stage source build; or deploy the published ghcr.io/lewtec/superfolha image.
            dockerfilePath: ./Dockerfile.build
            healthCheckPath: /
            disk:
              name: superfolha-data
              mountPath: /data
              sizeGB: 2
            envVars:
              - key: JWT_SECRET
                generateValue: true
              - key: STATE_DIR
                value: /data
              - key: DB_DRIVER
                value: sqlite
              - key: DATABASE_URL
                value: /data/superfolha.db
