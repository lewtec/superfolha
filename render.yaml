# Superfolha on Render: project-scoped web service + Postgres + disk for Git repos
# https://render.com/docs/blueprint-spec#projects-and-environments
projects:
  - name: superfolha
    environments:
      - name: production
        # Resources live under project "superfolha" / environment "production".
        # Do not also list them at the root — that keeps them ungrouped.
        services:
          - type: web
            name: superfolha
            runtime: docker
            plan: starter
            region: oregon
            dockerfilePath: ./Dockerfile
            healthCheckPath: /
            disk:
              name: superfolha-repos
              mountPath: /data
              sizeGB: 2
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: superfolha-db
                  property: connectionString
              - key: JWT_SECRET
                generateValue: true
              - key: STATE_DIR
                value: /data
              # PORT is injected by Render; the app reads it automatically.
              # Do not set GO_ENV=development in production.

        databases:
          - name: superfolha-db
            plan: basic-256mb
            databaseName: superfolha
            user: superfolha
