[tools]
bun = "1.3.8"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "v1.30.0"
go = "1.24.0"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "v1.64.5"
dprint = "0.51.1"

[env]
DATABASE_URL = "postgres://admin:admin@localhost:5423/admin?sslmode=disable"
JWT_SECRET = "paçoca"

[tasks."install:frontend"]
description = "Install frontend dependencies"
dir = "frontend"
run = "bun install"

[tasks."install:backend"]
description = "Install backend dependencies"
run = "go mod download"

[tasks.install]
description = "Install all dependencies"
depends = ["install:*"]

[tasks."build:frontend"]
description = "Build frontend for production"
dir = "frontend"
run = "bun run build"

[tasks."build:backend"]
description = "Build backend binary"
depends = ["build:frontend"]
run = "go build -o superfolha cmd/superfolha"

[tasks.build]
description = "Build complete application"
depends = ["build:*"]
run = "echo 'Build complete! Binary: ./server'"

[tasks."codegen:sqlc"]
run = "sqlc generate"

[tasks."codegen:relay"]
dir = "frontend"
run = "bun relay"

[tasks."codegen:graphql"]
run = "go run github.com/99designs/gqlgen generate"

[tasks.codegen]
depends = ["codegen:*"]

[tasks.docker]
description = "Build Docker image"
depends = ["build"]
run = "docker build -t superfolha ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."fmt:frontend"]
dir = "frontend"
run = "bun run format"

[tasks."fmt:backend"]
run = "go fmt ./..."

[tasks."fmt:markdown"]
run = "dprint fmt"

[tasks.fmt]
description = "Format code"
depends = ["fmt:*"]

[tasks."lint:frontend"]
dir = "frontend"
run = "bun run lint"

[tasks."lint:backend"]
run = "golangci-lint run --timeout 5m ./..."

[tasks.lint]
description = "Lint code"
depends = ["lint:*"]

[tasks.ci]
depends = ["lint", "test"]

[tasks."devdb:up"]
run = " docker run --rm -e POSTGRES_PASSWORD=admin -e POSTGRES_USER=admin -e POSTGRES_DATABASE=admin -d -p 5423:5432 postgres"
