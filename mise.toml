[tools]
bun = "1.3.8"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.30.0"
"go:github.com/golangci/golangci-lint/cmd/golangci-lint" = "1.64.5"
go = "1.25.5"
tinytex = "2024.02"

[env]
DATABASE_URL = "postgres://admin:admin@localhost:5423/admin?sslmode=disable"
JWT_SECRET = "paçoca"

[tasks."install:frontend"]
description = "Install frontend dependencies"
dir = "frontend"
run = "bun install"

[tasks."install:backend"]
description = "Install backend dependencies"
run = "go get ./..."

[tasks.install]
description = "Install all dependencies"
depends = ["install:*"]

[tasks."build:frontend"]
description = "Build frontend for production"
dir = "frontend"
run = "bun run build"

[tasks."build:backend"]
description = "Build backend binary"
depends = ["build:frontend"]
run = "go build -o superfolha cmd/superfolha"

[tasks.build]
description = "Build complete application"
depends = ["build:*"]
run = "echo 'Build complete! Binary: ./server'"

[tasks."gen:sqlc"]
run = "sqlc generate"

[tasks."gen:relay"]
dir = "frontend"
run = "bun relay"

[tasks."gen:graphql"]
run = "go run github.com/99designs/gqlgen generate"

[tasks.gen]
depends = ["gen:*"]

[tasks.codegen]
description = "Update generated code"
run = "mise run gen && mise run fmt"

[tasks.docker]
description = "Build Docker image"
depends = ["build"]
run = "docker build -t superfolha ."

[tasks."test:backend"]
run = "go test ./..."

[tasks.test]
description = "Run tests"
depends = ["test:*"]

[tasks."fmt:frontend"]
dir = "frontend"
run = "bun run format"

[tasks."fmt:backend"]
run = "go fmt ./..."

[tasks.fmt]
description = "Format code"
depends = ["fmt:*"]

[tasks."lint:frontend"]
dir = "frontend"
run = "bun run lint"

[tasks."lint:backend"]
run = "golangci-lint run ./..."

[tasks.lint]
description = "Lint code"
depends = ["lint:*"]

[tasks.ci]
depends = ["lint", "test"]

[tasks."devdb:up"]
run = " docker run --rm -e POSTGRES_PASSWORD=admin -e POSTGRES_USER=admin -e POSTGRES_DATABASE=admin -d -p 5423:5432 postgres"
