[tools]
bun = "1.3.8"
"ubi:sqlc-dev/sqlc" = "1.30.0"
go = "1.25.5"
tinytex = "latest"
"ubi:golangci/golangci-lint" = "1.64.8"

[env]
DATABASE_URL = "postgres://admin:admin@localhost:5423/admin?sslmode=disable"
JWT_SECRET = "paçoca"

[tasks."install:frontend"]
description = "Install frontend dependencies"
dir = "frontend"
run = "bun install"

[tasks."install:backend"]
description = "Install backend dependencies"
run = "go mod download"

[tasks.install]
description = "Install all dependencies"
depends = ["install:*"]

[tasks."build:frontend"]
description = "Build frontend for production"
dir = "frontend"
run = "bun run build"

[tasks."build:backend"]
description = "Build backend binary"
depends = ["build:frontend"]
run = "go build -o superfolha cmd/superfolha"

[tasks.build]
description = "Build complete application"
depends = ["build:*"]
run = "echo 'Build complete! Binary: ./server'"

[tasks."codegen:sqlc"]
run = "sqlc generate"

[tasks."codegen:relay"]
dir = "frontend"
run = "bun relay"

[tasks."codegen:graphql"]
run = "go run github.com/99designs/gqlgen generate"

[tasks.codegen]
description = "Generate code"
depends = ["codegen:*"]

[tasks.docker]
description = "Build Docker image"
depends = ["build"]
run = "docker build -t superfolha ."

[tasks."test:backend"]
description = "Run backend tests"
run = "go test ./..."

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."fmt:frontend"]
dir = "frontend"
run = "bun run format"

[tasks."fmt:backend"]
run = "go fmt ./..."

[tasks.fmt]
description = "Format code"
depends = ["fmt:*"]

[tasks."lint:frontend"]
dir = "frontend"
run = "bun run lint"

[tasks."lint:backend"]
run = "golangci-lint run ./..."

[tasks.lint]
description = "Lint code"
depends = ["lint:*"]

[tasks.ci]
description = "Run CI checks"
depends = ["lint", "test"]

[tasks."devdb:up"]
run = " docker run --rm -e POSTGRES_PASSWORD=admin -e POSTGRES_USER=admin -e POSTGRES_DATABASE=admin -d -p 5423:5432 postgres"
