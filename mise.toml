[tools]
bun = "1.3.8"
"github:sqlc-dev/sqlc" = "1.31.1"
go = "1.25.5"
tinytex = "2026.02"

[env]
# SQLite defaults to {STATE_DIR}/superfolha.db when DATABASE_URL is unset.
# For Postgres 18+ (uuidv7()):
# DB_DRIVER=postgres DATABASE_URL=postgres://admin:admin@localhost:5423/superfolha?sslmode=disable
JWT_SECRET = "paçoca"

[tasks."install:frontend"]
description = "Install frontend dependencies"
dir = "frontend"
run = "bun install"

[tasks."install:backend"]
description = "Install backend dependencies"
run = "go get ./..."

[tasks.install]
description = "Install all dependencies"
depends = ["install:*"]

[tasks."build:frontend"]
description = "Build frontend for production"
dir = "frontend"
run = "bun run build"

[tasks."build:backend"]
description = "Build backend binary (embeds frontend via -tags release)"
depends = ["build:frontend"]
run = "go build -tags release -o superfolha ./cmd/superfolha"

[tasks.build]
description = "Build complete application"
depends = ["build:backend"]
run = "echo 'Build complete! Binary: ./superfolha'"

[tasks."gen:sqlc"]
run = "sqlc generate"

[tasks."gen:relay"]
dir = "frontend"
run = "bun relay"

[tasks."gen:graphql"]
run = "go run github.com/99designs/gqlgen generate"

[tasks.gen]
depends = ["gen:*"]

[tasks.docker]
description = "Build production Docker image (multi-stage: SPA + Go release + TeX Live)"
run = "docker build -t superfolha ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks."fmt:frontend"]
dir = "frontend"
run = "bun run format"

[tasks."fmt:backend"]
run = "go fmt ./..."

[tasks.fmt]
description = "Format code"
depends = ["fmt:*"]

[tasks."lint:frontend"]
dir = "frontend"
run = "bun run lint"

[tasks."lint:backend"]
run = "go vet ./..."

[tasks.lint]
description = "Lint code"
depends = ["lint:*"]

[tasks.ci]
depends = ["lint", "fmt", "test"]

# Bundles the SPA into the binary (-tags release) and serves it from Go.
# Data (SQLite + Git repos) lives under gitignored ./data.
[tasks.start]
description = "Build SPA, run server with embedded UI (./data)"
depends = ["build:frontend"]
env = { GO_ENV = "development" }
run = "mkdir -p data && go run -tags release ./cmd/superfolha --state-dir=./data"

# Optional: Vite HMR only (Go without -tags release proxies to 127.0.0.1:5174).
[tasks."start:vite"]
description = "Vite dev server alone (use with go run without -tags release)"
dir = "frontend"
run = "bun run dev"

[tasks."devdb:up"]
description = "Start disposable Postgres 18 (uuidv7()) for dual-backend local testing"
run = "docker run --rm --name superfolha-pg -e POSTGRES_PASSWORD=admin -e POSTGRES_USER=admin -e POSTGRES_DB=superfolha -d -p 5423:5432 postgres:18"
