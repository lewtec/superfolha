[tools]
bun = "1.3.8"
"github:sqlc-dev/sqlc" = "1.31.1"
go = "1.25.5"
goreleaser = "2.15.4"
svu = "3.3.0"
tinytex = "2026.02"

[env]
# SQLite defaults to {STATE_DIR}/superfolha.db when DATABASE_URL is unset.
# For Postgres 18+ (uuidv7()):
# DB_DRIVER=postgres DATABASE_URL=postgres://admin:admin@localhost:5423/superfolha?sslmode=disable
JWT_SECRET = "paçoca"

[tasks."install:frontend"]
description = "Install CSS/editor JS dependencies"
run = "bun install"

[tasks."install:backend"]
description = "Install backend dependencies"
run = "go get ./..."

[tasks.install]
description = "Install all dependencies"
depends = ["install:*"]

[tasks.codegen]
description = "bun CSS + editor island + templ generate"
run = "go generate ./..."

[tasks."build:frontend"]
description = "Build CSS and editor island"
depends = ["codegen"]
wait_for = ["codegen"]
run = "true"

[tasks."build:backend"]
description = "Build backend binary (embeds templ CSS + editor.js)"
depends = ["codegen"]
wait_for = ["codegen"]
run = "go build -o superfolha ./cmd/superfolha"

[tasks.build]
description = "Build complete application"
depends = ["build:backend"]
run = "echo 'Build complete! Binary: ./superfolha'"

[tasks."gen:sqlc"]
run = "sqlc generate"

[tasks."gen:templ"]
run = "go tool templ generate"

[tasks.gen]
depends = ["codegen", "gen:sqlc"]

[tasks.docker]
description = "Build production Docker image from source (multi-stage Dockerfile.build)"
run = "docker build -f Dockerfile.build -t superfolha ."

[tasks."docker:goreleaser-dry"]
description = "Snapshot GoReleaser (binaries; docker tags get -amd64 suffix in snapshot mode)"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.release]
description = "svu bump → git tag → GoReleaser (binaries + ghcr.io/lewtec/superfolha)"
usage = '''
arg "<version>" help="svu mode: next (semver from commits), or major/minor/patch" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
# Version is entirely from git tags via svu — no version.txt.
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
git tag "$TAG"
git push origin "refs/tags/$TAG"
goreleaser release --clean
'''

[tasks."fmt:backend"]
run = "go fmt ./..."

[tasks.fmt]
description = "Format code"
depends = ["fmt:backend"]

[tasks."lint:backend"]
depends = ["fmt"]
wait_for = ["fmt"]
run = "go vet ./..."

[tasks.lint]
description = "Lint after fmt"
depends = ["lint:backend"]
wait_for = ["lint:backend"]

[tasks.test]
description = "Run tests after fmt (no gofmt rewrite mid-test)"
depends = ["fmt"]
wait_for = ["fmt"]
run = "go test ./..."

[tasks.ci]
description = "fmt once → then lint, test, codegen (GoReleaser before hook)"
depends = ["lint", "test", "codegen"]
wait_for = ["lint", "test", "codegen"]

[tasks.start]
description = "Codegen + run server (./data)"
depends = ["codegen"]
wait_for = ["codegen"]
env = { GO_ENV = "development" }
run = "mkdir -p data && go run ./cmd/superfolha --state-dir=./data"

[tasks."devdb:up"]
description = "Start disposable Postgres 18 (uuidv7()) for dual-backend local testing"
run = "docker run --rm --name superfolha-pg -e POSTGRES_PASSWORD=admin -e POSTGRES_USER=admin -e POSTGRES_DB=superfolha -d -p 5423:5432 postgres:18"
